name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only run if CI passed (via branch protection or previous job)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration:vitest

      - name: Build
        run: pnpm run package

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Each registry is enabled by the presence of its token, which is how
          # semantic-release-vsce itself decides. VSCE_PAT is therefore passed
          # only when the repository variable VSCE_PUBLISH is the string "true":
          # while the Marketplace listing is unavailable, passing the token would
          # make the plugin verify it, fail, and abort the whole release before
          # any commit is analysed - taking the GitHub and Open VSX channels down
          # with it. Blanking it makes the Marketplace be skipped instead.
          VSCE_PAT: ${{ vars.VSCE_PUBLISH == 'true' && secrets.VSCE_PAT || '' }}
          # Open VSX publishes whenever the secret exists. Absent, it is skipped.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec semantic-release
