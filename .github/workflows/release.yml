name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only run if CI passed (via branch protection or previous job)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration:vitest

      - name: Build
        run: pnpm run package

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          # Marketplace publishing is opt-in: set the repository variable
          # VSCE_PUBLISH to "true" to enable it. While it is unset, releases
          # still produce the tag, the GitHub release, the .vsix and its
          # checksum - a Marketplace problem no longer takes that channel down
          # with it. See release.config.mjs.
          VSCE_PUBLISH: ${{ vars.VSCE_PUBLISH }}
        run: pnpm exec semantic-release
